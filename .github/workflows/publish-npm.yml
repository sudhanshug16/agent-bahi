name: Publish npm

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/publish-npm.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install npm
        run: |
          npm install --global npm@12.0.2
          test "$(npm --version)" = "12.0.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run release checks
        run: bun run release:check

      - name: Inspect npm package
        run: npm pack --dry-run

      - name: Pack and smoke-test npm package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "const p = require('./package.json'); if (!p.name) throw new Error('package name is missing'); p.name")"
          PACKAGE_VERSION="$(node -p "const p = require('./package.json'); if (!p.version) throw new Error('package version is missing'); p.version")"
          test "$PACKAGE_NAME" = "@sudhanshug/agent-bahi"
          test "$PACKAGE_VERSION" = "1.0.0"

          PACK_JSON="$(npm pack --pack-destination "$RUNNER_TEMP" --json)"
          TARBALL="$(node -e '
            const path = require("node:path");
            const [packageName, rawMetadata] = process.argv.slice(1);
            const metadata = JSON.parse(rawMetadata);
            const pack = metadata && typeof metadata === "object" && !Array.isArray(metadata) && Object.keys(metadata).length === 1 && Object.hasOwn(metadata, packageName) ? metadata[packageName] : undefined;
            const filename = pack && typeof pack === "object" && !Array.isArray(pack) ? pack.filename : undefined;
            if (typeof filename !== "string" || !/^[A-Za-z0-9][A-Za-z0-9._-]*\.tgz$/.test(filename) || path.basename(filename) !== filename) throw new Error("npm pack metadata is invalid");
            process.stdout.write(filename);
          ' "$PACKAGE_NAME" "$PACK_JSON")"
          TARBALL="$RUNNER_TEMP/$TARBALL"
          test -f "$TARBALL"

          SMOKE_DIR="$(mktemp -d "$RUNNER_TEMP/agent-bahi-smoke.XXXXXX")"
          trap 'rm -rf "$SMOKE_DIR" "$TARBALL"' EXIT
          (
            cd "$SMOKE_DIR"
            npm init --yes >/dev/null
          )
          npm install --ignore-scripts --no-audit --no-fund --prefix "$SMOKE_DIR" "$TARBALL"
          PATH="$SMOKE_DIR/node_modules/.bin:$PATH" agent-bahi --version | grep -Fx "$PACKAGE_VERSION"
          PATH="$SMOKE_DIR/node_modules/.bin:$PATH" agent-bahi --help >/dev/null

      - name: Publish new npm version
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "const p = require('./package.json'); if (!p.name) throw new Error('package name is missing'); p.name")"
          PACKAGE_VERSION="$(node -p "const p = require('./package.json'); if (!p.version) throw new Error('package version is missing'); p.version")"
          PREFLIGHT_ERROR="$RUNNER_TEMP/npm-version-preflight-error.txt"
          echo "npm publish preflight: checking exact registry version."
          set +e
          VERSION_STATUS="$(node scripts/npm-version-preflight.mjs "$PACKAGE_NAME" "$PACKAGE_VERSION" 2>"$PREFLIGHT_ERROR")"
          PREFLIGHT_STATUS=$?
          set -e

          if [ "$PREFLIGHT_STATUS" -ne 0 ]; then
            if [ -s "$PREFLIGHT_ERROR" ]; then
              cat "$PREFLIGHT_ERROR" >&2
            else
              echo "npm version preflight failed without diagnostics; refusing to publish." >&2
            fi
            exit "$PREFLIGHT_STATUS"
          fi

          case "$VERSION_STATUS" in
            exists)
              echo "$PACKAGE_NAME@$PACKAGE_VERSION already exists; nothing to publish."
              exit 0
              ;;
            absent)
              ;;
            *)
              echo "npm version preflight returned an invalid result; refusing to publish." >&2
              exit 1
              ;;
          esac

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "Refusing to publish: GitHub Actions OIDC environment is unavailable." >&2
            exit 1
          fi

          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Refusing to publish: NODE_AUTH_TOKEN is set; use npm Trusted Publishing." >&2
            exit 1
          fi

          reject_npmrc_auth_token() {
            local npmrc_path="$1"
            if [ -f "$npmrc_path" ] && grep -Eqi '(^|:)_authtoken[[:space:]]*=' "$npmrc_path"; then
              echo "Refusing to publish: npm config contains _authToken; use npm Trusted Publishing." >&2
              exit 1
            fi
          }

          reject_npmrc_auth_token ".npmrc"
          reject_npmrc_auth_token "$HOME/.npmrc"
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ]; then
            reject_npmrc_auth_token "$NPM_CONFIG_USERCONFIG"
          fi

          NPM_LOG_DIR="$RUNNER_TEMP/npm-publish-debug"
          mkdir -p "$NPM_LOG_DIR"
          export npm_config_logs_dir="$NPM_LOG_DIR"

          redact_npm_log() {
            sed -E \
              -e 's#https?://[^[:space:]]+#<redacted-url>#g' \
              -e 's#(ACTIONS_ID_TOKEN_REQUEST_TOKEN[[:space:]]*[:=][[:space:]]*)[^[:space:]]+#\1<redacted>#Ig' \
              -e 's#((^|[[:space:]])(authorization|proxy-authorization|cookie|set-cookie)[[:space:]]*:[[:space:]]*).*$#\1<redacted>#Ig' \
              -e 's#((^|[?&[:space:]])[A-Za-z0-9_-]*(access[_-]?token|id[_-]?token|refresh[_-]?token|token|auth|secret|password|passwd|credential|cookie|api[_-]?key|apikey)[A-Za-z0-9_-]*[[:space:]]*[:=][[:space:]]*)(Bearer[[:space:]]+|JWT[[:space:]]+)?[^&[:space:]]+#\1<redacted>#Ig' \
              -e 's#((^|[[:space:]])(bearer|jwt)[[:space:]]+)[^[:space:]]+#\1<redacted>#Ig' \
              -e 's#(^|[^[:alnum:]_-])(eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)([^[:alnum:]_-]|$)#\1<redacted-jwt>\3#g'
          }

          set +e
          echo "npm publish stage: starting Trusted Publishing publish."
          npm publish --access public --provenance --loglevel verbose
          PUBLISH_STATUS=$?
          set -e

          if [ "$PUBLISH_STATUS" -ne 0 ]; then
            set +e
            LATEST_NPM_LOG=""
            if [ -d "$NPM_LOG_DIR" ]; then
              mapfile -d '' NPM_LOGS < <(find "$NPM_LOG_DIR" -type f -name '*-debug-*.log' -print0 | sort -z)
              if [ "${#NPM_LOGS[@]}" -gt 0 ]; then
                LATEST_NPM_LOG="${NPM_LOGS[${#NPM_LOGS[@]} - 1]}"
              fi
            fi
            if [ -z "$LATEST_NPM_LOG" ] || [ ! -f "$LATEST_NPM_LOG" ]; then
              echo "npm publish failed; no npm debug log was found under RUNNER_TEMP." >&2
            elif [ ! -s "$LATEST_NPM_LOG" ]; then
              echo "npm publish failed; npm debug log was empty: $LATEST_NPM_LOG" >&2
            else
              redact_npm_log "$LATEST_NPM_LOG" >&2
            fi
            set -e
          fi

          exit "$PUBLISH_STATUS"
